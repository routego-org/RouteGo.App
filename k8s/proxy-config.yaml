# nginx config for the web-portal's https-proxy sidecar (see deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-portal-proxy
  labels: { app.kubernetes.io/name: web-portal, app.kubernetes.io/part-of: routego }
data:
  default.conf: |
    server {
        listen 8081;
        client_max_body_size 10m;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            # HTTPS ended at CloudFront; tell the portal the customer's real scheme.
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }
