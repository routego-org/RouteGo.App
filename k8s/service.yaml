apiVersion: v1
kind: Service
metadata:
  name: web-portal
  labels: { app.kubernetes.io/name: web-portal, app.kubernetes.io/part-of: routego }
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: web-portal }
  ports:
    - { name: http, port: 80, targetPort: http }   # -> the https-proxy sidecar (8081), which forwards to the portal
