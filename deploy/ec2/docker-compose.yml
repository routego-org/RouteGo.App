# EC2 deployment of the Web Portal. Started by start.sh. No .env file: the settings
# (identity-url, notification-url, fleet-url, seat-inventory-url, search-url, booking-url, reporting-url,
# audit-url and ticket-bucket, all required, and the optional photo-delivery-origin and
# photo-upload-origin that let bus photos load and upload) come from SSM /routego/prod/portal/, and the
# Notification internal key from the Secrets Manager secret routego/internal-key, through the EC2
# instance role.
#
# Joins the network the other RouteGo containers share, so the portal reaches Identity by its
# container name (http://identity:8080/) without leaving the server.
#
# Requests enter through nginx (nginx.conf), which tells the portal they arrived over https. Host
# port 8080 is nginx's 8081; the portal's own 8080 is reachable only from inside its namespace.
name: routego-app
services:
  app:
    image: routego/app:latest
    restart: unless-stopped
    ports:
      # Published here because nginx shares this container's network namespace.
      - "8080:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AWS_REGION: ap-south-1
    volumes:
      # Data Protection key ring: keeps people signed in across restarts and redeploys.
      - portal-keys:/keys
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: "service:app"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  portal-keys:

networks:
  default:
    name: ec2_default
    external: true
