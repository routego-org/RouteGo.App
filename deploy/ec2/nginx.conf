# Nginx in front of the portal. It shares the portal container's network namespace, so it reaches
# the portal on 127.0.0.1 — the only proxy address ASP.NET's forwarded-headers middleware trusts by
# default — and the portal's own port 8080 is never published to the host.
#
# X-Forwarded-Proto is fixed to https: in production every Secure cookie and the antiforgery check
# require an https request. Today the only way in is an SSH tunnel to http://localhost (where
# browsers accept Secure cookies); when CloudFront is added it terminates https in front of this.
server {
    listen 8081;

    # The pay page of the classroom gateway (MockGateway, started with Payment). It shares the site's
    # address so the customer never leaves it. Only /pay/ is routed: MockGateway's /api/ and /admin/
    # stay on the private network. The name is looked up per request (Docker's resolver), so the
    # portal still starts when MockGateway is not running.
    location /pay/ {
        resolver 127.0.0.11 valid=10s;
        set $gateway http://mock-gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
